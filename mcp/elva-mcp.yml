note: >-
  Elva's own platform declares an OAuth-protected MCP resource at https://app.getelva.ai/mcp
  via RFC 9728 protected-resource metadata (served on both api.getelva.ai and app.getelva.ai,
  probed 2026-09-07, HTTP 200), with an RFC 8414 authorization server at https://app.getelva.ai
  supporting authorization_code + PKCE (S256) and dynamic client registration — the discovery
  chain a Claude custom connector walks. An anonymous MCP initialize POST to the endpoint
  returns HTTP 404 with an empty body, so the live tools/list schema requires an authenticated
  OAuth session; no tool list is published anonymously and none is recorded here. Separately,
  Elva's core product GENERATES per-customer hosted MCP servers (each customer deployment gets
  its own runtime URL / public install page, optionally on a custom domain) — those are
  customer surfaces, not an Elva-branded public server, and are not cataloged as endpoints.
