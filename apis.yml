name: Elva
description: >-
  API management platform for the agentic era: reads repos to build an API catalog, enforces per-audience contracts,
  generates tests, and turns APIs into governed, hosted MCP servers for AI agents. Built by Theneo. Exposes a public
  no-auth OpenAPI scoring REST API and an llms.txt.
